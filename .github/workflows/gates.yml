# The uchar gate set (WAY-OF-WORKING.md section 6; the gate list lives in
# CLAUDE.md and grows monotonically). The gates run LOCALLY before every
# landing, with `make gates` in the repository root (the root Makefile:
# first the three builds, then the gates in parallel; maintainer decision
# 2026-10-25); GitHub Actions is not used (maintainer decision 2026-09-26).
# This file documents the order and the per-gate environment and runs by
# hand only.
name: gates

on:
  workflow_dispatch:

jobs:
  self-contained:
    name: "Gate 1: self-containedness"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-self-contained
        run: sh scripts/check-self-contained.sh

  ir-schema:
    name: "Gate 2: IR schema + round-trip"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install jsonschema
        run: python3 -m pip install --user jsonschema
      - name: check-ir-schema
        run: sh scripts/check-ir-schema.sh

  case-schema:
    name: "Gate 4: corpus case files"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install jsonschema
        run: python3 -m pip install --user jsonschema
      - name: check-case-schema
        run: sh scripts/check-case-schema.sh

  verifier:
    name: "Gate 3: IR verifier"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
      - name: install yojson + zarith
        # the gate builds the whole OCaml workspace (scripts/lib/ocaml-build.sh), ref and its zarith among it
        run: opam install -y yojson zarith
      - name: check-verifier
        run: opam exec -- sh scripts/check-verifier.sh

  oracle:
    name: "Gate 5: oracle (ref/ replays the corpus)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
      - name: install yojson + zarith
        run: opam install -y yojson zarith
      - name: check-oracle
        run: opam exec -- sh scripts/check-oracle.sh
      - name: ref/ unit tests (worked examples of RUNTIME-SEMANTICS ch. 1-2, 4.6)
        run: opam exec -- dune build @ref/runtest

  clingo:
    name: "Gate 6: differential (ref = Clingo over the corpus)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
      - name: install yojson + zarith
        run: opam install -y yojson zarith
      - name: install clingo
        # Ubuntu ships the clingo binary in the gringo package
        run: sudo apt-get update && sudo apt-get install -y gringo && clingo --version
      - name: check-clingo
        run: opam exec -- sh scripts/check-clingo.sh

  noop:
    name: "Gate 7: no-op guard (a do-nothing executor must fail)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
      - name: install yojson + zarith
        run: opam install -y yojson zarith
      - name: check-noop
        run: opam exec -- sh scripts/check-noop.sh

  red:
    name: "Gate 8: red corpus (expected faults observed in both executors)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
      - name: install yojson + zarith
        run: opam install -y yojson zarith
      - name: install clingo
        # Ubuntu ships the clingo binary in the gringo package
        run: sudo apt-get update && sudo apt-get install -y gringo && clingo --version
      - name: check-red
        run: opam exec -- sh scripts/check-red.sh

  catala:
    # The gate-9 CI leg is conditional by maintainer decision (2026-08-24):
    # the catala dependency may enter CI, but only where the catala tools
    # are already available on the runner — on the bare PATH or inside the
    # runner's own opam switch (the standard developer install). On runners
    # without catala — github.com's hosted runners among them — the job
    # skips LOUDLY and is not a blocker; a forced frontend regression is
    # therefore caught only on runners that carry catala, and the gate
    # remains the reviewer's pre-merge duty on such a machine. Where catala
    # IS present the gate runs in the runner's own environment (opam exec
    # against the existing switch — deliberately no setup-ocaml here: a
    # fresh switch would mask the catala libraries the frontend links
    # against) and any failure there, including a missing dune or clingo,
    # is a real blocker: a runner that carries catala must carry the rest.
    # The gate script itself is unchanged and still fails hard without
    # catala, so a local run can never be silently green.
    name: "Gate 9: Catala frontend (runs where catala is available)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: detect catala
        id: has-catala
        run: |
          if command -v catala >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "via=direct" >> "$GITHUB_OUTPUT"
            catala --version
          elif command -v opam >/dev/null 2>&1 && opam exec -- sh -c 'command -v catala' >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "via=opam" >> "$GITHUB_OUTPUT"
            opam exec -- catala --version
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=gate 9 skipped::the catala compiler is not on this runner (bare PATH nor opam switch); per the maintainer decision of 2026-08-24 this is NOT a blocker. Gate 9 runs in full wherever the catala tools exist (bash scripts/check-catala.sh) and remains the reviewer's pre-merge duty there."
          fi
      - name: check-catala (in the runner's own environment)
        if: steps.has-catala.outputs.present == 'true'
        run: |
          if [ "${{ steps.has-catala.outputs.via }}" = "opam" ]; then
            opam exec -- bash scripts/check-catala.sh
          else
            bash scripts/check-catala.sh
          fi

  regelspraak:
    # Unconditional and blocking by maintainer decision (2026-08-27):
    # unlike gate 9, hosted CI must catch a RegelSpraak frontend
    # regression — the JDK comes from setup-java and the two tool jars
    # are plain public downloads the Makefile fetches (cached here), so
    # nothing about this gate depends on a specially-provisioned runner.
    name: "Gate 10: RegelSpraak frontend (unconditional, blocking)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: cache the ANTLR + JUnit tool jars
        uses: actions/cache@v4
        with:
          path: frontends/regelspraak/lib
          key: regelspraak-jars-antlr-4.13.2-junit-1.10.2
      - name: check-regelspraak
        run: bash scripts/check-regelspraak.sh

  toka-parity:
    # Gate 11 — the toka/ parity zone (maintainer decision 2026-08-27; a
    # regular gate of the set since 2026-10-13). Unconditional and
    # blocking: hosted CI must catch a frontend-vs-toolchain TOKA parity
    # regression AND a differential-replay divergence. It is NOT the same
    # shape as gate 10 any more: obligation 4 (the decision-V6-A replay)
    # runs every toka case through ref, clingo and the Drools backend, so
    # this job needs the FULL toolchain of gates 6 + 12 combined — setup-java
    # (frontend + Drools shaded jar), setup-ocaml + yojson/zarith (ref/clingo
    # via dune), the clingo binary (gringo), and python3+jsonschema (the
    # gate-2 schema leg over the replay slices). The Drools uber-jar is built
    # once here (as gate 12 does) so the gate runs jar-only; ref/clingo build
    # inside the script under opam exec. The gate script itself fails LOUDLY
    # on any missing tool, so a local run can never be silently green.
    name: "Gate 11: TOKA parity zone (unconditional, blocking)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
      - name: install yojson + zarith
        run: opam install -y yojson zarith
      - name: install clingo
        # Ubuntu ships the clingo binary in the gringo package
        run: sudo apt-get update && sudo apt-get install -y gringo && clingo --version
      - name: install jsonschema
        run: python3 -m pip install --user jsonschema
      - name: cache the ANTLR + JUnit tool jars
        uses: actions/cache@v4
        with:
          path: frontends/regelspraak/lib
          key: regelspraak-jars-antlr-4.13.2-junit-1.10.2
      - name: build the shaded Drools-runtime uber-jar (+ round-trip witness test)
        run: mvn -B -f backends/drools/pom.xml package
      - name: check-toka-parity
        run: opam exec -- bash scripts/check-toka-parity.sh

  drools:
    # Gate 12 — the Drools differential leg of the square (maintainer decision
    # 2026-08-27). Unconditional and blocking, the gate-10 pattern: the JDK
    # comes from setup-java and the Drools + Jackson artifacts are plain public
    # Maven downloads (cached here), so nothing depends on a specially-
    # provisioned runner. The shaded runtime uber-jar is built ONCE (which also
    # runs the loader round-trip witness test), then the gate runs JAR-ONLY.
    name: "Gate 12: Drools backend differential (unconditional, blocking)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: build the shaded Drools-runtime uber-jar (+ round-trip witness test)
        run: mvn -B -f backends/drools/pom.xml package
      - name: check-drools
        run: bash scripts/check-drools.sh

  reftype-derivation:
    # Gate 13 — the annotation-indifference harness (maintainer decision
    # 2026-09-04): every unit-bearing type annotation on reference and
    # composite positions is twisted and all three executors must still
    # reproduce the pinned outcomes — consumers derive units from
    # declarations (RUNTIME-SEMANTICS 2.10). Needs all three executors:
    # OCaml for ref and the ASP translator, gringo for clingo, the JDK
    # for the Drools jar.
    name: "Gate 13: reference-type derivation (annotation-indifference)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
      - name: install yojson + zarith
        run: opam install -y yojson zarith
      - name: install clingo
        # Ubuntu ships the clingo binary in the gringo package
        run: sudo apt-get update && sudo apt-get install -y gringo && clingo --version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: build the shaded Drools-runtime uber-jar
        run: mvn -B -f backends/drools/pom.xml package
      - name: check-reftype-derivation
        run: opam exec -- bash scripts/check-reftype-derivation.sh

  flogic:
    # Gate 14 — the F-logic frontend (card flogic-frontend, 2026-09-12): a
    # second source language reaching the same kernel subtyping. Needs
    # OCaml (the frontend, the verifier and ref) and gringo (the suite
    # replays every case through the ASP backend too), and nothing else —
    # this frontend links no external toolchain, so unlike gate 9 the leg
    # is unconditional and blocking. Invoked with BASH, like gates 10-13:
    # the script uses process substitution and is a syntax error under sh.
    name: "Gate 14: F-logic frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
      - name: install yojson + zarith
        run: opam install -y yojson zarith
      - name: install clingo
        # Ubuntu ships the clingo binary in the gringo package
        run: sudo apt-get update && sudo apt-get install -y gringo && clingo --version
      - name: check-flogic
        run: opam exec -- bash scripts/check-flogic.sh

  graaf:
    # Gate 15 — the rule graph of the Drools backend holds to IR-SPEC ch. 5
    # (card graaf-samenvoeging-en-gate, 2026-09-26). Needs OCaml (the
    # verifier's --dependency-edges mode), a JDK with javac (the route
    # suite is compiled by the gate), the frontend's tool jars (fetched by
    # make) and mvn (the backend jar). Unconditional and blocking.
    name: "Gate 15: rule graph vs IR-SPEC ch. 5 (unconditional, blocking)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
      - name: install yojson + zarith
        run: opam install -y yojson zarith
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: cache the ANTLR + JUnit tool jars
        uses: actions/cache@v4
        with:
          path: frontends/regelspraak/lib
          key: regelspraak-jars-antlr-4.13.2-junit-1.10.2
      - name: check-graph
        run: opam exec -- bash scripts/check-graph.sh

  scenario:
    # Gate 16 — the scenariotoetsen extension of the RegelSpraak frontend
    # (card scenariolaag-in-uchar, 2026-09-26): scenario documents
    # regenerate their pinned case files byte-identically. Jar-only, like
    # gate 10. Unconditional and blocking.
    name: "Gate 16: RegelSpraak scenario documents (unconditional, blocking)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: cache the ANTLR + JUnit tool jars
        uses: actions/cache@v4
        with:
          path: frontends/regelspraak/lib
          key: regelspraak-jars-antlr-4.13.2-junit-1.10.2
      - name: check-scenario
        run: bash scripts/check-scenario.sh

  readings:
    # Gate 17 — the reading of a condition at the fixpoint (RUNTIME-SEMANTICS
    # ch. 5.12; card ref-trace-and-readings-gate, 2026-10-21): the reference
    # interpreter's trace and the Drools backend's readings, on both of its
    # branches, agree per golden case file. Needs OCaml for ref and the JDK
    # with Maven for the backend jar, which the gate takes fresh or rebuilds.
    name: "Gate 17: readings at the fixpoint (ref ≡ Drools, unconditional, blocking)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
      - name: install yojson + zarith
        run: opam install -y yojson zarith
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: build the shaded Drools-runtime uber-jar
        run: mvn -B -f backends/drools/pom.xml -DskipTests package
      - name: check-readings
        run: opam exec -- bash scripts/check-readings.sh
