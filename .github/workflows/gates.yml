# The uchar gate set, run on every change (WAY-OF-WORKING.md section 6;
# the gate list lives in CLAUDE.md and grows monotonically).
name: gates

on:
  push:
  pull_request:

jobs:
  self-contained:
    name: "Gate 1: self-containedness"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-self-contained
        run: sh scripts/check-self-contained.sh

  ir-schema:
    name: "Gate 2: IR schema + round-trip"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install jsonschema
        run: python3 -m pip install --user jsonschema
      - name: check-ir-schema
        run: sh scripts/check-ir-schema.sh

  verifier:
    name: "Gate 3: IR verifier"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
      - name: install yojson
        run: opam install -y yojson
      - name: check-verifier
        run: opam exec -- sh scripts/check-verifier.sh
